# Grafana Helm values for Local Monitoring on System 1 (macOS)
# Chart: grafana/grafana

service:
  type: NodePort
  nodePort: 30000

adminUser: admin
adminPassword: admin

resources:
  requests:
    cpu: "50m"
    memory: "128Mi"
  limits:
    cpu: "300m"
    memory: "384Mi"

persistence:
  enabled: false

# Auto-provision local Prometheus datasource
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus-server.monitoring.svc.cluster.local
        isDefault: true
        access: proxy
        jsonData:
          httpMethod: POST
          timeInterval: "5s"

# Auto-provision CMCKO Observability dashboard
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: "cmcko"
        orgId: 1
        folder: "CMCKO Observability"
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/cmcko

dashboardsConfigMaps:
  cmcko: "grafana-dashboards-cmcko"

plugins: []
