# Prometheus Helm values for Local Monitoring on System 1 (macOS)
# Chart: prometheus-community/prometheus

server:
  service:
    type: NodePort
    nodePort: 30001

  # In-memory storage for fastest local demo startup
  persistentVolume:
    enabled: false

  retention: "3d"

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  global:
    scrape_interval: 5s
    evaluation_interval: 5s
    external_labels:
      cluster: "cluster-01"

alertmanager:
  enabled: false

prometheus-pushgateway:
  enabled: false

# Deploy kube-state-metrics for pod and HPA metadata
kube-state-metrics:
  enabled: true

extraScrapeConfigs: |
  # Scrape Beyla eBPF metrics from local cluster-01
  - job_name: "cmcko-system1-mac"
    scrape_interval: 5s
    honor_labels: true
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - beyla
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
        action: keep
        regex: beyla
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod
      - target_label: cluster
        replacement: "cluster-01"
    metric_relabel_configs:
      - source_labels: [k8s_cluster_name]
        target_label: cluster
        regex: "(.+)"
        replacement: "${1}"

  # Scrape System 2 (WSL2 k3s) over Tailscale / LAN
  - job_name: "cmcko-system2-wsl"
    scrape_interval: 5s
    static_configs:
      - targets: ["SYSTEM_2_IP:30090"]
        labels:
          cluster: "cluster-02"
          system: "windows-wsl2"
    metric_relabel_configs:
      - source_labels: [k8s_cluster_name]
        target_label: cluster
        regex: "(.+)"
        replacement: "${1}"
