# Prometheus Helm values — Phase 0
# Using prometheus-community/prometheus (simple, not the full kube-prometheus-stack)
# Reference: https://github.com/prometheus-community/helm-charts/tree/main/charts/prometheus
#
# KEY FIX: Do NOT override serverFiles.prometheus.yml.global — the chart already
# generates a global block and a second one causes "field global already set" crash.
# Use 'server.global' for global config and 'extraScrapeConfigs' for custom jobs.

# ──────────────────────────────────────────────────────────────────────────────
# Server configuration
# ──────────────────────────────────────────────────────────────────────────────
server:
  # Expose via NodePort so we can access Prometheus from localhost
  service:
    type: NodePort
    nodePort: 30001

  # Lightweight persistent storage — 2Gi is enough for a demo
  persistentVolume:
    enabled: true
    size: 2Gi

  # Retention: 7 days is plenty for a demo project
  retention: "7d"

  # Conservative resources
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  # Global settings — scrape interval and cluster identity label
  # This is the CORRECT place; do NOT also set global inside serverFiles.
  global:
    scrape_interval: 15s
    evaluation_interval: 15s
    external_labels:
      cluster: "cluster-01"

# ──────────────────────────────────────────────────────────────────────────────
# Disable components we don't need to keep things light
# ──────────────────────────────────────────────────────────────────────────────
alertmanager:
  enabled: false

prometheus-pushgateway:
  enabled: false

# ──────────────────────────────────────────────────────────────────────────────
# kube-state-metrics — adds pod/deployment/namespace metadata
# ──────────────────────────────────────────────────────────────────────────────
kube-state-metrics:
  enabled: true

# ──────────────────────────────────────────────────────────────────────────────
# Extra scrape configs — appended to the chart's default prometheus.yml.
# This is the correct way to add custom jobs without touching serverFiles.
# ──────────────────────────────────────────────────────────────────────────────
extraScrapeConfigs: |
  # Scrape Beyla metrics via its Kubernetes Service endpoints
  - job_name: "beyla"
    honor_labels: true
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - beyla
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
        action: keep
        regex: beyla
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: namespace
      - source_labels: [__meta_kubernetes_node_name]
        action: replace
        target_label: node
