# Grafana Beyla Helm values — Phase 0 (single cluster)
# Reference: https://grafana.com/docs/beyla/latest/setup/kubernetes-helm/
#
# KEY DESIGN PRINCIPLE:
#   Beyla uses eBPF to observe application traffic WITHOUT modifying app code.
#   It runs as a DaemonSet so it covers every node in the cluster.

# ──────────────────────────────────────────────────────────────────────────────
# Beyla core configuration
# ──────────────────────────────────────────────────────────────────────────────
config:
  data:
    # Log level: debug is useful during initial setup
    log_level: info

    # Prometheus exporter — Beyla exposes metrics on :9090/metrics
    prometheus_export:
      port: 9090
      path: /metrics

    # Which processes/services to instrument.
    # discover.instrument restricts Beyla to the 'demo' namespace only,
    # which avoids accidentally observing kube-system or monitoring stack.
    discovery:
      instrument:
        - k8s_namespace: "demo"

    # Kubernetes metadata enrichment:
    # Attaches pod, namespace, node, deployment labels to every metric.
    attributes:
      kubernetes:
        enable: true

    # Network metrics (L4 — TCP/UDP flows):
    # Enabled so we can see inter-service network traffic.
    network:
      enable: true
      cidrs: []

# ──────────────────────────────────────────────────────────────────────────────
# Kubernetes deployment options
# ──────────────────────────────────────────────────────────────────────────────

# Beyla MUST run as a DaemonSet to cover all nodes
preset: daemonset

# Expose a Service so Prometheus can scrape /metrics
service:
  enabled: true

# ServiceMonitor disabled — we use prometheus-community/prometheus (simple chart),
# not kube-prometheus-stack, so ServiceMonitor CRD is not installed.
# Prometheus scrapes Beyla directly via the scrape_configs in prometheus/values.yaml.
serviceMonitor:
  enabled: false

# ──────────────────────────────────────────────────────────────────────────────
# Resource limits — conservative for limited hardware
# ──────────────────────────────────────────────────────────────────────────────
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

# ──────────────────────────────────────────────────────────────────────────────
# Beyla requires host-level access to load eBPF programs
# ──────────────────────────────────────────────────────────────────────────────
podSecurityContext: {}

securityContext:
  privileged: true
  runAsUser: 0

# Mount /sys and /proc from the host so eBPF can access kernel structures
extraVolumes:
  - name: sys-fs-bpf
    hostPath:
      path: /sys/fs/bpf
      type: DirectoryOrCreate
  - name: kernel-debug
    hostPath:
      path: /sys/kernel/debug
      type: DirectoryOrCreate

extraVolumeMounts:
  - name: sys-fs-bpf
    mountPath: /sys/fs/bpf
    mountPropagation: Bidirectional
  - name: kernel-debug
    mountPath: /sys/kernel/debug
    readOnly: false

# tolerations: allow Beyla to run on control-plane nodes in a single-node cluster
tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"
  - key: "node-role.kubernetes.io/master"
    operator: "Exists"
    effect: "NoSchedule"
