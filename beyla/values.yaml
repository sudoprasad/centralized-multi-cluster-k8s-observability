# Grafana Beyla Helm values — Phase 2 (L7 Application Observability + RED Metrics)
# Target: cluster-01
# Requires Linux host / WSL2 for userspace eBPF uprobes.

config:
  data:
    log_level: info

    prometheus_export:
      port: 9090
      path: /metrics

    prometheus_features:
      - application
      - network
      - network_flow_packets
      - stats
      - stats_tcp_retransmits
      - stats_tcp_rtt

    # L7 Discovery: inspect Go/Python/Node runtimes and HTTP services in demo namespace
    discovery:
      instrument:
        - k8s_namespace: "demo"
          open_ports: "8080,5678,7070"

    # Route pattern grouping to aggregate endpoints into clean metrics
    routes:
      unmatched: heuristic
      patterns:
        - /
        - /auth
        - /backend
        - /api/v1/*

    attributes:
      kubernetes:
        enable: true

    # Retain L4 network flow metrics alongside L7
    network:
      enable: true
      cidrs: []

preset: application

service:
  enabled: true

serviceMonitor:
  enabled: false

env:
  BEYLA_KUBE_CLUSTER_NAME: "cluster-01"

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

podSecurityContext: {}

securityContext:
  privileged: true
  runAsUser: 0

extraVolumes:
  - name: sys-fs-bpf
    hostPath:
      path: /sys/fs/bpf
      type: DirectoryOrCreate
  - name: kernel-debug
    hostPath:
      path: /sys/kernel/debug
      type: DirectoryOrCreate

extraVolumeMounts:
  - name: sys-fs-bpf
    mountPath: /sys/fs/bpf
    mountPropagation: Bidirectional
  - name: kernel-debug
    mountPath: /sys/kernel/debug
    readOnly: false
