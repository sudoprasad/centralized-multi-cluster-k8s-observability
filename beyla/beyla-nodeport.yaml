apiVersion: v1
kind: Service
metadata:
  name: beyla-metrics-nodeport
  namespace: beyla
  labels:
    app.kubernetes.io/name: beyla
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: beyla
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
      nodePort: 30090
      protocol: TCP
