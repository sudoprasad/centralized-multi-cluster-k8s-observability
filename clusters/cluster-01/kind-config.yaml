# kind cluster configuration for cluster-01
# Single-node cluster for Phase 0 proof of concept
# Uses a single control-plane node to minimise resource usage on limited hardware

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

name: cluster-01

nodes:
  - role: control-plane
    # Extra port mappings allow NodePort services to be reached from localhost
    extraPortMappings:
      - containerPort: 30000   # Grafana NodePort
        hostPort: 30000
        protocol: TCP
      - containerPort: 30001   # Prometheus NodePort
        hostPort: 30001
        protocol: TCP
      - containerPort: 30080   # Frontend NodePort for JMeter external traffic
        hostPort: 30080
        protocol: TCP
      - containerPort: 30090   # Beyla NodePort for external metrics scraping
        hostPort: 30090
        protocol: TCP
