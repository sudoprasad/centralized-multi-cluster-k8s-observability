global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # System 1: macOS Cluster (OrbStack) — eBPF Beyla Metrics
  - job_name: "cmcko-system1-mac"
    scrape_interval: 5s
    static_configs:
      - targets: ["SYSTEM_1_IP:30090"]
        labels:
          cluster: "cluster-01"
          system: "macos-orbstack"
    metric_relabel_configs:
      - source_labels: [k8s_cluster_name]
        target_label: cluster
        regex: "(.+)"
        replacement: "${1}"

  # System 2: Windows Cluster (WSL2 k3s) — eBPF Beyla Metrics
  - job_name: "cmcko-system2-wsl"
    scrape_interval: 5s
    static_configs:
      - targets: ["SYSTEM_2_IP:30090"]
        labels:
          cluster: "cluster-02"
          system: "windows-wsl2"
    metric_relabel_configs:
      - source_labels: [k8s_cluster_name]
        target_label: cluster
        regex: "(.+)"
        replacement: "${1}"
